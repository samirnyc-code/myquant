<!doctype html><html><head><meta charset="utf-8"><title>2E Trade Review — v3 interactive</title>
<script src="vendor/plotly.min.js"></script>
<style>
  :root{--blu:#2a78d6;--red:#b23a2e;--grn:#2e8b57;--org:#d98a2b;--gry:#8a8f94;--pur:#7a5cc0}
  *{box-sizing:border-box} body{font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f5f0;color:#222}
  header{padding:10px 16px;border-bottom:1px solid #e6e6e0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff}
  h1{font-size:15px;margin:0}
  .chip{background:#fbfbf8;border:1px solid #e0e0d8;border-radius:8px;padding:5px 9px;font-size:12px}
  .ok{background:#e8f5ee;border-color:#bfe3cf;color:#1c6b41;font-weight:700}
  .bad{background:#fbeaea;border-color:#eec4c0;color:#a1281f;font-weight:700}
  button{font:inherit;padding:5px 11px;border:1px solid #cfcfc6;background:#fff;border-radius:7px;cursor:pointer}
  button.on{background:#2a78d6;color:#fff;border-color:#2a78d6}
  .wrap{display:grid;grid-template-columns:1fr 250px;gap:12px;padding:12px 16px}
  .card{background:#fff;border:1px solid #eceae2;border-radius:10px;padding:8px 10px;margin-bottom:12px}
  .zrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .side{position:sticky;top:12px;height:fit-content}
  .gutter,.notes{background:#fff;border:1px solid #eceae2;border-radius:10px;padding:11px;margin-bottom:12px}
  .gutter h3,.notes h3{margin:0 0 9px;font-size:12px;color:#666}
  .lev{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #eee}
  .sw{width:14px;border-top:3px dotted #999;flex:0 0 14px}.lev .nm{flex:1;color:#555}.lev .px{font-weight:700;font-variant-numeric:tabular-nums}
  .note{font-size:12px;border-bottom:1px solid #f0f0ea;padding:6px 0}.note .del{float:right;color:#b23a2e;cursor:pointer}
  .hint{font-size:11px;color:#999;margin-top:6px}
</style></head><body>
<header>
  <h1 id="ttl">2E Trade Review</h1>
  <span class="chip" id="gap"></span><span class="chip" id="net"></span><span class="chip" id="vf"></span>
  <span style="flex:1"></span>
  <button id="btnZoom" class="on">🔍 Zoom/Pan</button>
  <button id="btnAnn">✎ Annotate (select bars)</button>
  <button id="btnExport">⭳ Export notes</button>
</header>
<div class="wrap">
  <div>
    <div class="card"><div id="ctx" style="height:420px"></div></div>
    <div class="card"><div class="zrow"><div id="zEntry" style="height:300px"></div><div id="zExit" style="height:300px"></div></div></div>
  </div>
  <div class="side">
    <div class="gutter"><h3>PRICE LEVELS</h3><div id="levels"></div></div>
    <div class="notes"><h3>MY NOTES</h3><div id="noteList"></div>
      <div class="hint">Click <b>Annotate</b>, then box-select bars on the top chart (or click one) → type a note. Saved locally; export to JSON. (P2 will auto-commit these.)</div></div>
  </div>
</div>
<script>
const D=__DATA__, T=D.trade;
document.getElementById('ttl').textContent=`${T.date} · ${T.book} · net $${T.net}`;
document.getElementById('gap').innerHTML=`gap <b>${T.gap}%</b> · ADR10 <b>${T.adr}</b> · thr 0.54 · <b>${Math.abs(T.gap)<=0.54?'TRADE':'SKIP'}</b>`;
document.getElementById('net').innerHTML=`exit <b>${T.extype}</b> ${T.ex}`;
const vf=document.getElementById('vf'); vf.className='chip '+(T.verified?'ok':'bad'); vf.textContent=T.verified?'✓ VERIFIED':'✗ NOT VERIFIED';
const LV=[['Prior close',T.pc,'#7a5cc0'],['2EL trigger',T.trigger,'#d98a2b'],['Entry (fill)',T.fill,'#2a78d6'],
  ['Signal-bar low',T.sb_lo,'#8a8f94'],['Stop 0.30×ADR',T.stop,'#b23a2e'],[`Exit (${T.extype})`,T.ex,'#2e8b57']];
document.getElementById('levels').innerHTML=LV.map(([n,p,c])=>`<div class="lev"><span class="sw" style="border-color:${c}"></span><span class="nm">${n}</span><span class="px" style="color:${c}">${p}</span></div>`).join('');

const modeCol={bull:'rgba(46,139,87,.10)',bear:'rgba(178,58,46,.10)',neutral:'rgba(138,143,148,.06)'};
const shapes=D.regime.map(s=>({type:'rect',xref:'x',yref:'paper',x0:s.x0,x1:s.x1,y0:0,y1:1,fillcolor:modeCol[s.mode],line:{width:0},layer:'below'}));
LV.forEach(([n,p,c])=>shapes.push({type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:p,y1:p,line:{color:c,width:1,dash:'dot'},layer:'below'}));

const cndl={type:'candlestick',x:D.candles.x,open:D.candles.o,high:D.candles.h,low:D.candles.l,close:D.candles.c,
  increasing:{line:{color:'#2e9e8f'}},decreasing:{line:{color:'#e0574a'}},name:'5m',showlegend:false};
const prior={type:'candlestick',x:[D.prior.x],open:[D.prior.o],high:[D.prior.h],low:[D.prior.l],close:[D.prior.c],
  increasing:{line:{color:'#c9c9c2'}},decreasing:{line:{color:'#c9c9c2'}},showlegend:false,name:'prior'};
const ema={type:'scatter',mode:'lines',x:D.candles.x,y:D.ema20,line:{color:'#c98a10',width:1.6},name:'EMA20'};
const layoutA={margin:{l:52,r:16,t:10,b:28},dragmode:'zoom',xaxis:{rangeslider:{visible:false},type:'date'},
  yaxis:{side:'right'},shapes,plot_bgcolor:'#fff',paper_bgcolor:'#fff',showlegend:false,
  annotations:[{x:T.sig_mark,yref:'paper',y:0.02,text:'2EL',showarrow:true,arrowhead:0,ax:0,ay:16,font:{size:10,color:'#8a6a12'}}]};
Plotly.newPlot('ctx',[cndl,prior,ema],layoutA,{responsive:true,displaylogo:false,scrollZoom:true});

function zfig(el,z,title){
  const sh=z.levels.map(l=>({type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:l.y,y1:l.y,line:{color:l.c,width:1.1,dash:'dot'}}));
  const ann=z.levels.map(l=>({xref:'paper',x:1,y:l.y,text:l.l+' '+l.y,showarrow:false,xanchor:'right',font:{size:10,color:l.c},bgcolor:'rgba(255,255,255,.7)'}));
  ann.push({x:z.mark_x,y:z.y[z.mark_x],text:title.includes('ENTRY')?'FILL':'EXIT',showarrow:true,arrowhead:2,ay:-28,font:{size:10,color:'#111'}});
  Plotly.newPlot(el,[{type:'scatter',mode:'lines',x:z.x,y:z.y,line:{color:'#33454d',width:1.3}}],
    {margin:{l:48,r:10,t:24,b:20},title:{text:title,font:{size:12}},xaxis:{showticklabels:false},yaxis:{side:'right'},
     shapes:sh,annotations:ann,plot_bgcolor:'#fff',paper_bgcolor:'#fff'},{responsive:true,displaylogo:false,scrollZoom:true});
}
zfig('zEntry',D.entry,'ENTRY zoom — limit fills on tick through');
zfig('zExit',D.exit,'EXIT zoom — '+T.extype);

// ---- annotation ----
const KEY='2ereview:'+T.date; let notes=JSON.parse(localStorage.getItem(KEY)||'[]');
const ctx=document.getElementById('ctx');
function redraw(){
  const ann=layoutA.annotations.slice(0,1).concat(notes.map((nn,i)=>({x:nn.x0,yref:'paper',y:0.96,text:'📝'+(i+1),showarrow:true,arrowhead:1,ax:0,ay:-14,font:{size:11},captureevents:true})));
  const sh=shapes.concat(notes.filter(nn=>nn.x1).map(nn=>({type:'rect',xref:'x',yref:'paper',x0:nn.x0,x1:nn.x1,y0:0,y1:1,line:{color:'#2a78d6',width:1,dash:'dot'},fillcolor:'rgba(42,120,214,.05)'})));
  Plotly.relayout('ctx',{annotations:ann,shapes:sh});
  document.getElementById('noteList').innerHTML=notes.map((nn,i)=>`<div class="note"><span class="del" data-i="${i}">✕</span><b>${i+1}.</b> ${nn.text}<br><span style="color:#999;font-size:11px">${nn.x0.slice(11,16)}${nn.x1?'–'+nn.x1.slice(11,16):''}</span></div>`).join('')||'<span style="color:#aaa">none yet</span>';
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{notes.splice(+b.dataset.i,1);save();});
}
function save(){localStorage.setItem(KEY,JSON.stringify(notes));redraw();}
function addNote(x0,x1){const txt=prompt('Note for '+(x1?'selected bars':'this bar')+':');if(txt){notes.push({x0,x1,text:txt,ts:Date.now()});save();}}
ctx.on('plotly_click',e=>{if(mode==='ann'&&e.points&&e.points.length)addNote(e.points[0].x,null);});
ctx.on('plotly_selected',e=>{if(mode==='ann'&&e&&e.range)addNote(e.range.x[0],e.range.x[1]);});
let mode='zoom';
const bz=document.getElementById('btnZoom'),ba=document.getElementById('btnAnn');
bz.onclick=()=>{mode='zoom';bz.classList.add('on');ba.classList.remove('on');Plotly.relayout('ctx',{dragmode:'zoom'});};
ba.onclick=()=>{mode='ann';ba.classList.add('on');bz.classList.remove('on');Plotly.relayout('ctx',{dragmode:'select'});};
document.getElementById('btnExport').onclick=()=>{const b=new Blob([JSON.stringify({trade:T.date,notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='notes_'+T.date+'.json';a.click();};
redraw();
</script></body></html>
